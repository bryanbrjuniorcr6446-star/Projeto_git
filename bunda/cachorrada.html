<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cachorrada VIP</title>
    <style>
        :root { --main-brown: #8b4513; --grass-green: #2ecc71; }
        body { 
            margin: 0; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; background: #34495e; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #game-container { position: relative; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 8px solid #fff; }
        canvas { 
            background: linear-gradient(to bottom, #7cfc00, #2ecc71); 
            display: block; cursor: none;
        }
        .ui-panel {
            position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.9);
            padding: 10px 20px; border-radius: 50px; font-weight: bold; color: var(--main-brown);
            box-shadow: 0 4px 0 #ddd; font-size: 1.2rem;
        }
        .game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; backdrop-filter: blur(5px);
        }
        button {
            margin-top: 20px; padding: 12px 30px; font-size: 1.1rem; border: none;
            border-radius: 25px; background: #e67e22; color: white; cursor: pointer;
            transition: transform 0.2s; font-weight: bold;
        }
        button:hover { transform: scale(1.1); background: #d35400; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-panel">🦴 <span id="score">0</span></div>
        <canvas id="gameCanvas" width="500" height="600"></canvas>
        <div id="gameOverScreen" class="game-over">
            <h2 style="font-size: 3rem; margin: 0;">AU AU! 🐾</h2>
            <p style="font-size: 1.2rem;">A carrocinha te pegou!</p>
            <div id="finalScore" style="font-size: 1.5rem; margin: 10px 0;"></div>
            <button onclick="resetGame()">TENTAR DE NOVO</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalScoreElement = document.getElementById("finalScore");

    let score = 0;
    let gameOver = false;
    let dog = { x: 250, y: 520, size: 50 };
    let items = [];
    let particles = [];

    // Partículas para efeito de "ganhar osso"
    function createParticles(x, y) {
        for(let i=0; i<8; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random()-0.5)*10,
                vy: (Math.random()-0.5)*10,
                life: 20
            });
        }
    }

    function spawnItem() {
        const isCarrocinha = Math.random() < 0.25;
        items.push({
            x: Math.random() * (canvas.width - 40),
            y: -50,
            symbol: isCarrocinha ? '🚐' : '🦴',
            isBad: isCarrocinha,
            speed: 3 + Math.random() * 4,
            rotation: 0
        });
    }

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        dog.x = e.clientX - rect.left - dog.size / 2;
        if (dog.x < 0) dog.x = 0;
        if (dog.x > canvas.width - dog.size) dog.x = canvas.width - dog.size;
    });

    function resetGame() {
        score = 0;
        items = [];
        particles = [];
        gameOver = false;
        scoreElement.innerText = "0";
        gameOverScreen.style.display = "none";
        draw();
    }

    function update() {
        if (gameOver) return;

        if (Math.random() < 0.04) spawnItem();

        // Update Itens
        for (let i = items.length - 1; i >= 0; i--) {
            items[i].y += items[i].speed;
            items[i].rotation += 0.05;

            // Colisão Ajustada
            if (items[i].y > dog.y - 30 && items[i].y < dog.y + 30 && 
                items[i].x > dog.x - 30 && items[i].x < dog.x + 40) {
                
                if (items[i].isBad) {
                    gameOver = true;
                    gameOverScreen.style.display = "flex";
                    finalScoreElement.innerText = `Você fez ${score} pontos`;
                } else {
                    score += 10;
                    scoreElement.innerText = score;
                    createParticles(items[i].x, items[i].y);
                    items.splice(i, 1);
                }
            } else if (items[i].y > canvas.height) {
                items.splice(i, 1);
            }
        }

        // Update Partículas
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life--;
            if(p.life <= 0) particles.splice(i, 1);
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Desenhar Grama (detalhes)
        ctx.fillStyle = "rgba(0,0,0,0.05)";
        for(let i=0; i<10; i++) ctx.fillRect(i*60, 0, 2, canvas.height);

        // Desenhar Partículas
        particles.forEach(p => {
            ctx.fillStyle = `rgba(255, 255, 0, ${p.life/20})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
            ctx.fill();
        });

        // Desenhar Itens com sombra
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(0,0,0,0.2)";
        items.forEach(item => {
            ctx.font = "40px Arial";
            ctx.save();
            ctx.translate(item.x + 20, item.y + 20);
            ctx.rotate(item.isBad ? 0 : item.rotation);
            ctx.fillText(item.symbol, -20, 20);
            ctx.restore();
        });

        // Desenhar Cachorro
        ctx.shadowBlur = 15;
        ctx.shadowColor = "rgba(0,0,0,0.3)";
        ctx.font = "60px Arial";
        ctx.fillText("🐶", dog.x, dog.y + 40);
        ctx.shadowBlur = 0;

        if (!gameOver) {
            update();
            requestAnimationFrame(draw);
        }
    }

    draw();
</script>
</body>
</html>
