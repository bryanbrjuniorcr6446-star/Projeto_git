  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .font-elegant { font-family: 'Cormorant Garamond', Georgia, serif; }
    .font-soft { font-family: 'Quicksand', sans-serif; }
    
    .flower {
      position: fixed;
      top: -60px;
      font-size: 24px;
      pointer-events: none;
      z-index: 100;
      animation: fall linear forwards;
      opacity: 0.9;
    }
    
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      5% { opacity: 0.9; }
      95% { opacity: 0.9; }
      100% { transform: translateY(110%) rotate(720deg); opacity: 0; }
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    
    .card-appear { animation: fadeInUp 1.2s ease-out forwards; }
    .card-hover:hover { animation: pulse-soft 2s ease-in-out infinite; }
    
    .quote-transition {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    
    .btn-shimmer {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }
    
    @keyframes bounce-rotate {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.2) rotate(10deg); }
    }
    
    @keyframes heart-float {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }
    
    .floating-heart {
      position: fixed;
      font-size: 20px;
      pointer-events: none;
      z-index: 50;
      animation: heart-float 2s ease-out forwards;
    }
    
    .interactive-btn {
      cursor: pointer;
      user-select: none;
    }
    
    .gradient-border {
      background: linear-gradient(135deg, #fce4ec, #f8bbd9, #f48fb1, #fce4ec);
      background-size: 300% 300%;
      animation: gradient-move 8s ease infinite;
    }
    
    @keyframes gradient-move {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Envelope Styles */
    .envelope-closed {
      perspective: 1200px;
      cursor: pointer;
    }
    
    .envelope-container {
      position: relative;
      width: 300px;
      height: 200px;
      margin: 0 auto;
    }
    
    .envelope-back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f8bbd9 0%, #f48fb1 100%);
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(244, 143, 177, 0.4);
    }
    
    .envelope-front {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(244, 143, 177, 0.3);
      overflow: hidden;
    }
    
    .envelope-flap {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 100px solid #f48fb1;
      top: 0;
      left: 0;
      transform-origin: top center;
      transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 10;
    }
    
    .envelope-open .envelope-flap {
      transform: rotateX(-180deg);
    }
    
    .envelope-content {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 50%;
      opacity: 0;
      transition: opacity 0.8s ease 0.4s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .envelope-open .envelope-content {
      opacity: 1;
    }
    
    .envelope-text {
      font-size: 18px;
      color: #ad1457;
      font-family: 'Cormorant Garamond', Georgia, serif;
      text-align: center;
      font-style: italic;
      padding: 20px;
    }
    
    .open-envelope-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 30px;
      background: linear-gradient(135deg, #f8bbd9 0%, #f48fb1 100%);
      color: #880e4f;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(244, 143, 177, 0.3);
    }
    
    .open-envelope-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(244, 143, 177, 0.5);
    }
    
    .open-envelope-btn:active {
      transform: scale(0.95);
    }

    .hidden { display: none !important; }
  </style>

  <script>
    // Frases emocionantes para o cartão
    const quotes = [
      "Mãe, você é a mulher mais incrível que conheço. Sua força e amor iluminam minha vida todos os dias.",
      "Obrigado(a) por ser meu porto seguro, minha inspiração e meu maior exemplo de mulher forte e amorosa.",
      "Seu abraço é meu lugar favorito no mundo. Te amo mais do que as palavras podem expressar.",
      "Você me ensinou que amar é o verbo mais bonito. Obrigado(a) por todo carinho e dedicação.",
      "Mãe, sua força me inspira a ser melhor todos os dias. Você é minha heroína.",
      "Cada sorriso seu ilumina meu mundo. Você é a mulher mais especial da minha vida.",
      "Obrigado(a) por nunca desistir de mim e por me amar incondicionalmente.",
      "Você é a prova viva de que anjos existem. Te amo infinitamente, mãe.",
      "Sua bondade e gentileza tocam todos ao seu redor. Tenho orgulho de ser seu filho(a).",
      "Mãe, você é minha estrela-guia, meu exemplo de coragem e amor verdadeiro.",
      "Não existe amor mais puro e verdadeiro do que o seu. Gratidão eterna por você existir.",
      "Você transformou minha vida em algo lindo simplesmente por existir nela."
    ];
    
    let currentQuoteIndex = 0;
    
    // Default configuration
    const defaultConfig = {
      recipient_name: "Querida zaya tesuda",
      sender_name: "Com todo meu amor ❤️",
      primary_color: "#ad1457",
      secondary_color: "#f48fb1",
      text_color: "#6a1b4d",
      background_color: "#fff5f7",
      accent_color: "#1DB954",
      font_family: "Cormorant Garamond"
    };
    
    // Flower animation
    const flowers = ['🌸', '🌺', '💮', '🌹', '💐', '🪻', '🌼', '✿', '❀'];
    
    function createFlower() {
      const flower = document.createElement('div');
      flower.className = 'flower';
      flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
      flower.style.left = Math.random() * 100 + '%';
      flower.style.fontSize = (Math.random() * 20 + 16) + 'px';
      flower.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
      flower.style.animationDelay = Math.random() * 0.2 + 's';
      
      document.getElementById('flowers-container').appendChild(flower);
      
      setTimeout(() => flower.remove(), 3500);
    }
    
    // Initial burst of flowers
    function flowerBurst() {
      for (let i = 0; i < 30; i++) {
        setTimeout(createFlower, i * 100);
      }
    }
    
    // Continuous flower rain
    function startFlowerRain() {
      setInterval(createFlower, 150);
    }
    
    // Change quote function
    function changeQuote() {
      const quoteText = document.getElementById('quote-text');
      quoteText.style.opacity = '0';
      quoteText.style.transform = 'translateY(10px)';
      
      setTimeout(() => {
        currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
        quoteText.textContent = `"${quotes[currentQuoteIndex]}"`;
        quoteText.style.opacity = '1';
        quoteText.style.transform = 'translateY(0)';
        
        // Burst of flowers on quote change
        for (let i = 0; i < 8; i++) {
          setTimeout(createFlower, i * 50);
        }
      }, 300);
    }
    
    // Config change handler
    async function onConfigChange(config) {
      const fontFamily = config.font_family || defaultConfig.font_family;
      const primaryColor = config.primary_color || defaultConfig.primary_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const secondaryColor = config.secondary_color || defaultConfig.secondary_color;
      
      // Update recipient
      const recipient = document.getElementById('recipient');
      recipient.textContent = config.recipient_name || defaultConfig.recipient_name;
      recipient.style.fontFamily = `${fontFamily}, Georgia, serif`;
      
      // Update sender
      const sender = document.getElementById('sender');
      sender.textContent = config.sender_name || defaultConfig.sender_name;
      
      // Update title
      const title = document.getElementById('card-title');
      title.style.color = primaryColor;
      title.style.fontFamily = `${fontFamily}, Georgia, serif`;
      
      // Update quote
      const quote = document.getElementById('quote-text');
      quote.style.color = textColor;
      quote.style.fontFamily = `${fontFamily}, Georgia, serif`;
      quote.style.fontSize = `${(config.font_size || 18) * 1.1}px`;
      
      // Update recipient color
      recipient.style.color = secondaryColor;
    }
    
    // Map to capabilities
    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => { config.background_color = value; window.elementSdk.setConfig({ background_color: value }); }
          },
          {
            get: () => config.secondary_color || defaultConfig.secondary_color,
            set: (value) => { config.secondary_color = value; window.elementSdk.setConfig({ secondary_color: value }); }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); }
          },
          {
            get: () => config.primary_color || defaultConfig.primary_color,
            set: (value) => { config.primary_color = value; window.elementSdk.setConfig({ primary_color: value }); }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => { config.accent_color = value; window.elementSdk.setConfig({ accent_color: value }); }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || defaultConfig.font_family,
          set: (value) => { config.font_family = value; window.elementSdk.setConfig({ font_family: value }); }
        },
        fontSizeable: {
          get: () => config.font_size || 18,
          set: (value) => { config.font_size = value; window.elementSdk.setConfig({ font_size: value }); }
        }
      };
    }
    
    // Map to edit panel values
    function mapToEditPanelValues(config) {
      return new Map([
        ["recipient_name", config.recipient_name || defaultConfig.recipient_name],
        ["sender_name", config.sender_name || defaultConfig.sender_name]
      ]);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Start flower animations
      flowerBurst();
      setTimeout(startFlowerRain, 1000);
      
      // Envelope opening
      const openBtn = document.getElementById('open-btn');
      const envelopeState = document.getElementById('envelope-state');
      const cardState = document.getElementById('card-state');
      const envelopeClosed = document.getElementById('envelope-closed');
      const closeBtn = document.getElementById('close-btn');
      
      openBtn.addEventListener('click', () => {
        envelopeClosed.classList.add('envelope-open');
        
        setTimeout(() => {
          envelopeState.classList.add('hidden');
          cardState.classList.remove('hidden');
          
          // Extra burst when opening
          for (let i = 0; i < 20; i++) {
            setTimeout(createFlower, i * 50);
          }
        }, 800);
      });
      
      closeBtn.addEventListener('click', () => {
        cardState.classList.add('hidden');
        envelopeState.classList.remove('hidden');
        envelopeClosed.classList.remove('envelope-open');
      });
      
      // Setup quote change button
      document.getElementById('change-quote-btn').addEventListener('click', changeQuote);
      
      // Heart button - create floating hearts
      document.getElementById('heart-btn').addEventListener('click', (e) => {
        for (let i = 0; i < 5; i++) {
          setTimeout(() => {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = '❤️';
            heart.style.left = (e.clientX || window.innerWidth / 2) + 'px';
            heart.style.top = (e.clientY || window.innerHeight / 2) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
          }, i * 100);
        }
      });
      
      // Sparkle button - burst of flowers
      document.getElementById('sparkle-btn').addEventListener('click', () => {
        for (let i = 0; i < 15; i++) {
          setTimeout(createFlower, i * 50);
        }
      });
      
      // Rose button - extra roses floating
      document.getElementById('rose-btn').addEventListener('click', () => {
        for (let i = 0; i < 8; i++) {
          setTimeout(() => {
            const rose = document.createElement('div');
            rose.className = 'floating-heart';
            rose.textContent = '🌹';
            rose.style.left = Math.random() * window.innerWidth + 'px';
            rose.style.top = window.innerHeight + 'px';
            rose.style.animation = 'heart-float 3s ease-out forwards';
            document.body.appendChild(rose);
            setTimeout(() => rose.remove(), 3000);
          }, i * 150);
        }
      });
    });
    
    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
